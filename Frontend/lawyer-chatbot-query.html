<body>
        <script>authCheck({ requiredRole: 'lawyer' }); setupLogoutButton();</script>

        <div class="gpt-chat-root" style="width:100vw;min-height:100vh;display:flex;flex-direction:column;">
            <div class="gpt-chat-navbar">
                <nav class="navbar">
                    <div class="logo">⚖ Legal System</div>
                    <ul class="nav-links">
                        <li><a href="Ldash.html">Dashboard</a></li>
                        <li><a href="lawyer-chatbot-query.html" class="active">AI Chatbot</a></li>
                        <li><a href="#" id="logoutBtn" class="btn primary" style="margin-left:8px;">Logout</a></li>
                    </ul>
                </nav>
            </div>
            <div class="gpt-chat-outer" style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100vw;max-width:100vw;padding-top:0;margin-top:0;">
                <div id="chatbotHistory" class="chatbot-content-area" style="width:100vw;max-width:100vw;min-height:calc(100vh - 120px);"></div>
                <form class="gpt-chat-form" id="chatForm" autocomplete="off" style="max-width:100vw;width:100vw;">
                    <input type="text" id="lawyerQuery" class="chatbot-input" placeholder="Ask anything" required />
                    <button type="submit" aria-label="Send" class="btn primary chatbot-send-btn"><span style="font-size:1.3em;">&#9658;</span></button>
                </form>
            </div>
        </div>
    <script>
    const chatForm = document.getElementById('chatForm');
    const lawyerQuery = document.getElementById('lawyerQuery');
    const chatbotHistory = document.getElementById('chatbotHistory');


    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const query = lawyerQuery.value.trim();
        if (!query) return;
        // User message card
        // User message with avatar (right-aligned)
        const userMsgWrapper = document.createElement('div');
        userMsgWrapper.style.display = 'flex';
        userMsgWrapper.style.justifyContent = 'flex-end';
        userMsgWrapper.style.alignItems = 'flex-end';
        userMsgWrapper.style.gap = '8px';
        userMsgWrapper.style.width = '100vw';
        userMsgWrapper.style.paddingRight = '24px';
        const userAvatar = document.createElement('div');
        userAvatar.innerHTML = `<img src='https://ui-avatars.com/api/?name=You&background=2563eb&color=fff&rounded=true&size=36' alt='User' style='width:36px;height:36px;border-radius:50%;box-shadow:0 1px 4px #2563eb22;'>`;
        const userMsg = document.createElement('div');
        userMsg.className = 'chatbot-msg-card chatbot-msg-user';
        userMsg.innerHTML = query;
        userMsgWrapper.appendChild(userMsg);
        userMsgWrapper.appendChild(userAvatar);
        chatbotHistory.appendChild(userMsgWrapper);
        lawyerQuery.value = '';
        lawyerQuery.disabled = true;
        chatForm.querySelector('button').disabled = true;
        // Auto-scroll to bottom
        chatbotHistory.scrollTop = chatbotHistory.scrollHeight;
        try {
            const resp = await fetch('http://127.0.0.1:5000/legal/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await resp.json();
            // AI message with avatar (left-aligned)
            const aiMsgWrapper = document.createElement('div');
            aiMsgWrapper.style.display = 'flex';
            aiMsgWrapper.style.justifyContent = 'flex-start';
            aiMsgWrapper.style.alignItems = 'flex-end';
            aiMsgWrapper.style.gap = '8px';
            aiMsgWrapper.style.width = '100vw';
            aiMsgWrapper.style.paddingLeft = '24px';
            const aiAvatar = document.createElement('div');
            aiAvatar.innerHTML = `<img src='https://ui-avatars.com/api/?name=AI&background=f7f7fa&color=2563eb&rounded=true&size=36' alt='AI' style='width:36px;height:36px;border-radius:50%;box-shadow:0 1px 4px #2563eb22;'>`;
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chatbot-msg-card chatbot-msg-ai';
            if (data.analysis) {
                aiMsg.innerHTML = formatAnalysis(data.analysis);
            } else if (data.error) {
                aiMsg.innerHTML = `<span class='chatbot-msg-error'>Error: ${data.error}</span>`;
            }
            if (data.retrieved_cases && Array.isArray(data.retrieved_cases) && data.retrieved_cases.length > 0) {
                aiMsg.innerHTML += `<div style='font-size:13px;color:#2563eb;margin-top:10px;'><strong>Similar Cases (References):</strong><ul style='margin:4px 0 0 16px;'>${data.retrieved_cases.map(c => {
                    if (typeof c === 'string') return `<li>${c}</li>`;
                    // Convert case_number to a readable case name (e.g., "Crl. Appeal No. 1566-J of 2019" -> "Crl. Appeal 1566-J/2019")
                    let caseName = c.case_number ? c.case_number.replace(/No\.\s*/g, '').replace(/\s*\/\s*/g, ' | ').replace(/\sof\s/g, '/') : 'Unknown Case';
                    let summary = '';
                    if (c.judgment_summary) {
                        try {
                            const jsum = typeof c.judgment_summary === 'string' ? JSON.parse(c.judgment_summary) : c.judgment_summary;
                            summary = jsum.final_order ? `<div style='color:#222;font-size:12px;margin-top:2px;'>${jsum.final_order}</div>` : '';
                        } catch { summary = ''; }
                    }
                    return `<li><span style='font-weight:600;color:#1e293b;'>${caseName}</span> <span style='color:#64748b;font-size:12px;'>(reference)</span>${summary}</li>`;
                }).join('')}</ul></div>`;
            }
            aiMsgWrapper.appendChild(aiAvatar);
            aiMsgWrapper.appendChild(aiMsg);
            chatbotHistory.appendChild(aiMsgWrapper);
            // Auto-scroll to bottom
            chatbotHistory.scrollTop = chatbotHistory.scrollHeight;
        } catch (e) {
            const errMsg = document.createElement('div');
            errMsg.className = 'chatbot-msg-card chatbot-msg-error';
            errMsg.textContent = 'Error contacting AI server.';
            chatbotHistory.appendChild(errMsg);
            chatbotHistory.scrollTop = chatbotHistory.scrollHeight;
        }
        lawyerQuery.disabled = false;
        chatForm.querySelector('button').disabled = false;
        lawyerQuery.focus();
    });

    // Format analysis text into readable HTML (headings, lists, etc.)
    function formatAnalysis(text) {
        // Convert markdown-style headings and lists to HTML
        let html = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n\n/g, '<br><br>')
            .replace(/\n/g, '<br>');
        // Convert numbered headings (e.g., **4. How to Use in Argument:**) to h4
        html = html.replace(/<strong>(\d+\..*?:)<\/strong>/g, '<h4>$1</h4>');
        // Convert subheadings (e.g., **Key Legal Issues Addressed:**) to h5
        html = html.replace(/<strong>([A-Za-z].*?:)<\/strong>/g, '<h5>$1</h5>');
        // Convert * bullets to <ul><li>
        html = html.replace(/\* ([^\n<]*)/g, '<li>$1</li>');
        // Wrap <li> in <ul> if not already
        html = html.replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>');
        return html;
    }

    // Autofocus input on load
    window.onload = () => lawyerQuery.focus();
    </script>
